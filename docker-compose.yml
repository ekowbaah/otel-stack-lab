services:
  checkout-api:
    build: .
    environment: ["OTEL_SERVICE_NAME=checkout-api", "OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318"]
    ports: ["8080:8080"]
    depends_on: [otel-collector]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.137.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318", "8889:8889"]
  prometheus:
    image: prom/prometheus:v3.6.0
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./alerts.yml:/etc/prometheus/alerts.yml:ro"]
    ports: ["9090:9090"]
  tempo:
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./tempo.yaml:/etc/tempo.yaml:ro"]
    ports: ["3200:3200"]
  grafana:
    image: grafana/grafana:12.2.0
    environment: ["GF_AUTH_ANONYMOUS_ENABLED=true", "GF_AUTH_ANONYMOUS_ORG_ROLE=Admin"]
    ports: ["3000:3000"]
    depends_on: [prometheus, tempo]
  loki:
    image: grafana/loki:3.6.2
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes: ["./loki.yaml:/etc/loki/config.yaml:ro"]
    ports: ["3100:3100"]
