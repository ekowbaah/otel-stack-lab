receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
  filelog:
    include: [/var/log/app/*.jsonl]
    start_at: beginning
    operators:
      - type: json_parser
processors:
  batch: {}
  memory_limiter: { check_interval: 1s, limit_mib: 256 }
exporters:
  debug: { verbosity: basic }
  prometheus: { endpoint: 0.0.0.0:8889 }
  otlp/tempo: { endpoint: tempo:4317, tls: { insecure: true } }
  otlphttp/loki: { endpoint: http://loki:3100/otlp }
service:
  pipelines:
    traces: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug, otlp/tempo] }
    metrics: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug, prometheus] }
    logs: { receivers: [filelog], processors: [memory_limiter, batch], exporters: [debug, otlphttp/loki] }
